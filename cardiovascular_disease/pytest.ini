[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    integration: marks tests as integration tests (require running API)
    slow: marks tests as slow (model training tests)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
